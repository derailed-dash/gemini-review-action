name: "Dazbo's Gemini Code Review & Issue Triage"
description: "Automated Pull Request AI code reviews and Issue Triage using Google Gemini"
author: 'Dazbo (derailed-dash)'

# Note: To control which files trigger this action, configure `paths` or `paths-ignore`
# in the calling workflow's trigger configuration (e.g. in `.github/workflows/gemini-review.yml`).
#
# Examples:
#   on:
#     pull_request:
#       paths:
#         - 'src/**'           # Inclusion  : only trigger on files under src/
#         - '!src/**/*.enc'    # Exclusion: do not trigger on encrypted files
#
#       # Alternatively, exclude files/directories entirely:
#       # paths-ignore:
#       #   - 'docs/**'
#       #   - '**.md'

inputs:
  gemini_api_key:
    description: 'API key for Gemini'
    required: true
  github_token:
    description: 'GitHub token (defaults to secrets.GITHUB_TOKEN)'
    required: true
  gemini_model:
    description: 'Gemini model to use'
    required: false
    default: 'gemini-3.8-flash'
  command:
    description: 'Command to run (review, triage)'
    required: false
    default: 'review'
  language:
    description: 'Language to use for the review comments (e.g. English (UK), English (US), French, Spanish)'
    required: false
    default: 'English (UK)'
  timeout:
    description: 'Timeout for API requests in seconds'
    required: false
    default: '60'
  include_comment_history:
    description: 'Fetch and include prior PR review threads and conversation comments in prompt context'
    required: false
    default: 'true'
  billing_labels:
    description: >-
      Extra Cloud Billing labels for cost attribution, as `key=value,key=value`. Merged over the
      defaults (`component`, `repo`). Set to `none` to disable. VERTEX AI ONLY: the Gemini
      Developer API has no labels field, so this is ignored when authenticating with an API key.
    required: false
    default: ''
  resolve_addressed_threads:
    description: >-
      Resolve the GitHub review threads for findings this action reports as addressed, so
      "Require conversation resolution before merging" stops blocking on feedback the reviewer
      has already agreed is done. Only threads opened by this action, and only where the model
      supplied an exact file and line, are ever resolved. Off by default: closing a
      human-visible thread on someone's behalf is opinionated. NOTE: this requires a PAT or
      GitHub App token in `github_token`; the default GITHUB_TOKEN cannot resolve threads
      (the mutation is refused with FORBIDDEN) and the action will say so and carry on.
    required: false
    default: 'false'
  exclude_comment_authors:
    description: >-
      Comma-separated GitHub logins whose comments are kept OUT of the prompt, e.g.
      `claude[bot],some-other-reviewer[bot]`. Comment history exists so the reviewer does not
      re-raise its OWN addressed feedback; another automated reviewer's comments serve a
      different purpose entirely, since they hand this model its conclusions. Excluded comments
      never reach the prompt and are not counted in the reported tokens.
    required: false
    default: ''
  persona:
    description: 'Persona overlay for reviewer (straight, dazbo, palpatine, rick)'
    required: false
    default: 'straight'
  skip_inline_suggestions:
    description: 'Skip automated re-reviews when a commit is created by accepting an inline suggestion via GitHub UI'
    required: false
    default: 'true'
  custom_instructions:
    description: >-
      Custom instructions or guardrails to extend the review prompt. Can be inline
      text or a file path in the repository (defaults to .github/review-instruction-additions.md).
    required: false
    default: '.github/review-instruction-additions.md'
  thinking_level:
    description: 'Thinking / reasoning level for Gemini models (e.g. low, high, none, or numeric budget). Controls reasoning token output.'
    required: false
    default: ''
  max_candidate_files:
    description: 'Maximum number of candidate files considered during dynamic context selection (bounds token overhead in large monorepos).'
    required: false
    default: '500'
  extra_context_files:
    description: 'Comma-separated static repository files to attach directly to codebase context, bypassing dynamic LLM selection.'
    required: false
    default: ''
  context_diff_directories_only:
    description: 'Restricts dynamic context selection candidates strictly to directories containing modified files.'
    required: false
    default: 'false'
  context_exclude_patterns:
    description: 'Comma-separated glob patterns to exclude from codebase context candidate selection.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Run Script
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_MODEL: ${{ inputs.gemini_model }}
        GEMINI_LANGUAGE: ${{ inputs.language }}
        GEMINI_TIMEOUT: ${{ inputs.timeout }}
        GEMINI_EXCLUDE_COMMENT_AUTHORS: ${{ inputs.exclude_comment_authors }}
        GEMINI_RESOLVE_ADDRESSED_THREADS: ${{ inputs.resolve_addressed_threads }}
        GEMINI_INCLUDE_COMMENT_HISTORY: ${{ inputs.include_comment_history }}
        GEMINI_PERSONA: ${{ inputs.persona }}
        GEMINI_BILLING_LABELS: ${{ inputs.billing_labels }}
        GEMINI_SKIP_INLINE_SUGGESTIONS: ${{ inputs.skip_inline_suggestions }}
        GEMINI_CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
        GEMINI_THINKING_LEVEL: ${{ inputs.thinking_level }}
        GEMINI_MAX_CANDIDATE_FILES: ${{ inputs.max_candidate_files }}
        GEMINI_EXTRA_CONTEXT_FILES: ${{ inputs.extra_context_files }}
        GEMINI_CONTEXT_DIFF_DIRECTORIES_ONLY: ${{ inputs.context_diff_directories_only }}
        GEMINI_CONTEXT_EXCLUDE_PATTERNS: ${{ inputs.context_exclude_patterns }}
        GITHUB_REPOSITORY: ${{ github.repository }}

        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "${{ inputs.command }}" = "triage" ]; then
          uv run ${{ github.action_path }}/gemini_issue_triage.py
        else
          uv run ${{ github.action_path }}/gemini_pr_review.py
        fi

branding:
  icon: 'eye'
  color: 'purple'

