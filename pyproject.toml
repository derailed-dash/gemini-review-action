[project]
name = "gemini-review-action"
version = "1.9.0"
description = "GitHub Action for code reviews and issue triage using Google Gemini"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.34.0",
    "requests>=2.32.4",
    "pydantic>=2.13.0",
    "pillow>=12.0.0",
    "resvg-py>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.17.0",
    "codespell>=2.4.0",
    "rich>=14.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["starter-examples/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["gemini_review", "gemini_pr_review.py", "gemini_issue_triage.py"]
venvPath = "."
venv = ".venv"
